<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sinnoh Dex — BDSP</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f5f5;
      --surface: #fff;
      --border: #e0e0e0;
      --text: #1a1a1a;
      --muted: #888;
      --caught-bg: #e8f5e9;
      --caught-border: #4caf50;
      --caught-badge: #4caf50;
      --font: system-ui, -apple-system, sans-serif;
    }

    body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.5rem;
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 1.5rem;
      flex-wrap: wrap;
    }

    .back { font-size: 0.8rem; color: var(--muted); text-decoration: none; }
    .back:hover { color: var(--text); }

    header h1 { font-size: 1rem; font-weight: 600; white-space: nowrap; }

    .progress-bar-wrap {
      flex: 1; min-width: 120px; max-width: 260px;
      display: flex; flex-direction: column; gap: 3px;
    }
    .progress-label { font-size: 0.75rem; color: var(--muted); }
    .progress-bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--caught-badge); border-radius: 3px; transition: width 0.3s ease; }

    .filters { display: flex; gap: 0.4rem; margin-left: auto; }
    .filter-btn {
      padding: 0.3rem 0.75rem;
      border: 1px solid var(--border);
      background: transparent;
      border-radius: 99px;
      font-size: 0.8rem;
      cursor: pointer;
      color: var(--text);
      transition: background 0.15s, border-color 0.15s;
    }
    .filter-btn.active { background: var(--text); color: #fff; border-color: var(--text); }

    .search-wrap { display: flex; align-items: center; }
    #search {
      padding: 0.3rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 99px;
      font-size: 0.8rem;
      outline: none;
      width: 140px;
      background: transparent;
    }
    #search:focus { border-color: #999; }

    main { padding: 1.25rem 1rem; max-width: 1200px; margin: 0 auto; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
      gap: 0.5rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0.5rem 0.25rem 0.4rem;
      cursor: pointer;
      user-select: none;
      transition: border-color 0.15s, background 0.15s;
      position: relative;
    }
    .card:hover { border-color: #bbb; }
    .card.caught { background: var(--caught-bg); border-color: var(--caught-border); }
    .card.caught .check { opacity: 1; }
    .check { position: absolute; top: 4px; right: 5px; font-size: 0.65rem; color: var(--caught-badge); opacity: 0; }
    .card img { width: 56px; height: 56px; image-rendering: pixelated; }
    .card.not-caught img { filter: grayscale(1) opacity(0.35); }
    .card-num { font-size: 0.6rem; color: var(--muted); margin-top: 2px; }
    .card-name { font-size: 0.65rem; text-align: center; font-weight: 500; line-height: 1.2; margin-top: 1px; }
    .card.not-caught .card-name, .card.not-caught .card-num { color: var(--muted); }
    .empty { grid-column: 1 / -1; text-align: center; color: var(--muted); font-size: 0.9rem; padding: 3rem 0; }
  </style>
</head>
<body>

<header>
  <a class="back" href="../">← Projects</a>
  <h1>Sinnoh Dex — BDSP</h1>
  <div class="progress-bar-wrap">
    <div class="progress-label" id="progress-label">0 / 151</div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
  </div>
  <div class="search-wrap">
    <input id="search" type="search" placeholder="Search…" autocomplete="off">
  </div>
  <div class="filters">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="caught">Caught</button>
    <button class="filter-btn" data-filter="missing">Missing</button>
  </div>
</header>

<main>
  <div class="grid" id="grid"></div>
</main>

<script>
// [sinnohNum, nationalNum, name]
const POKEMON = [
  [1,387,'Turtwig'],[2,388,'Grotle'],[3,389,'Torterra'],
  [4,390,'Chimchar'],[5,391,'Monferno'],[6,392,'Infernape'],
  [7,393,'Piplup'],[8,394,'Prinplup'],[9,395,'Empoleon'],
  [10,396,'Starly'],[11,397,'Staravia'],[12,398,'Staraptor'],
  [13,399,'Bidoof'],[14,400,'Bibarel'],
  [15,401,'Kricketot'],[16,402,'Kricketune'],
  [17,403,'Shinx'],[18,404,'Luxio'],[19,405,'Luxray'],
  [20,63,'Abra'],[21,64,'Kadabra'],[22,65,'Alakazam'],
  [23,129,'Magikarp'],[24,130,'Gyarados'],
  [25,406,'Budew'],[26,315,'Roselia'],[27,407,'Roserade'],
  [28,41,'Zubat'],[29,42,'Golbat'],[30,169,'Crobat'],
  [31,74,'Geodude'],[32,75,'Graveler'],[33,76,'Golem'],
  [34,95,'Onix'],[35,208,'Steelix'],
  [36,408,'Cranidos'],[37,409,'Rampardos'],
  [38,410,'Shieldon'],[39,411,'Bastiodon'],
  [40,66,'Machop'],[41,67,'Machoke'],[42,68,'Machamp'],
  [43,54,'Psyduck'],[44,55,'Golduck'],
  [45,412,'Burmy'],[46,413,'Wormadam'],[47,414,'Mothim'],
  [48,265,'Wurmple'],[49,266,'Silcoon'],[50,267,'Beautifly'],
  [51,268,'Cascoon'],[52,269,'Dustox'],
  [53,415,'Combee'],[54,416,'Vespiquen'],
  [55,417,'Pachirisu'],
  [56,418,'Buizel'],[57,419,'Floatzel'],
  [58,420,'Cherubi'],[59,421,'Cherrim'],
  [60,422,'Shellos'],[61,423,'Gastrodon'],
  [62,214,'Heracross'],
  [63,190,'Aipom'],[64,424,'Ambipom'],
  [65,425,'Drifloon'],[66,426,'Drifblim'],
  [67,427,'Buneary'],[68,428,'Lopunny'],
  [69,92,'Gastly'],[70,93,'Haunter'],[71,94,'Gengar'],
  [72,200,'Misdreavus'],[73,429,'Mismagius'],
  [74,198,'Murkrow'],[75,430,'Honchkrow'],
  [76,431,'Glameow'],[77,432,'Purugly'],
  [78,434,'Stunky'],[79,435,'Skuntank'],
  [80,307,'Meditite'],[81,308,'Medicham'],
  [82,436,'Bronzor'],[83,437,'Bronzong'],
  [84,77,'Ponyta'],[85,78,'Rapidash'],
  [86,438,'Bonsly'],[87,185,'Sudowoodo'],
  [88,439,'Mime Jr.'],[89,122,'Mr. Mime'],
  [90,440,'Happiny'],[91,113,'Chansey'],[92,242,'Blissey'],
  [93,173,'Cleffa'],[94,35,'Clefairy'],[95,36,'Clefable'],
  [96,441,'Chatot'],
  [97,172,'Pichu'],[98,25,'Pikachu'],[99,26,'Raichu'],
  [100,163,'Hoothoot'],[101,164,'Noctowl'],
  [102,442,'Spiritomb'],
  [103,443,'Gible'],[104,444,'Gabite'],[105,445,'Garchomp'],
  [106,446,'Munchlax'],[107,143,'Snorlax'],
  [108,133,'Eevee'],[109,134,'Vaporeon'],[110,135,'Jolteon'],
  [111,136,'Flareon'],[112,196,'Espeon'],[113,197,'Umbreon'],
  [114,470,'Leafeon'],[115,471,'Glaceon'],
  [116,175,'Togepi'],[117,176,'Togetic'],[118,468,'Togekiss'],
  [119,228,'Houndour'],[120,229,'Houndoom'],
  [121,215,'Sneasel'],[122,461,'Weavile'],
  [123,361,'Snorunt'],[124,362,'Glalie'],[125,478,'Froslass'],
  [126,447,'Riolu'],[127,448,'Lucario'],
  [128,449,'Hippopotas'],[129,450,'Hippowdon'],
  [130,451,'Skorupi'],[131,452,'Drapion'],
  [132,453,'Croagunk'],[133,454,'Toxicroak'],
  [134,455,'Carnivine'],
  [135,456,'Finneon'],[136,457,'Lumineon'],
  [137,458,'Mantyke'],[138,226,'Mantine'],
  [139,459,'Snover'],[140,460,'Abomasnow'],
  [141,479,'Rotom'],
  [142,480,'Uxie'],[143,481,'Mesprit'],[144,482,'Azelf'],
  [145,483,'Dialga'],[146,484,'Palkia'],
  [147,485,'Heatran'],[148,486,'Regigigas'],
  [149,487,'Giratina'],[150,488,'Cresselia'],
  [151,490,'Manaphy'],
];

const STORAGE_KEY = 'bdsp-sinnoh-dex';
const SPRITE = id => `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${id}.png`;

let caught = new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'));
let filter = 'all';
let query = '';

function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify([...caught])); }

function updateProgress() {
  const n = caught.size;
  document.getElementById('progress-label').textContent = `${n} / ${POKEMON.length}`;
  document.getElementById('progress-fill').style.width = `${(n / POKEMON.length) * 100}%`;
}

function render() {
  const grid = document.getElementById('grid');
  const q = query.toLowerCase();
  const visible = POKEMON.filter(([s, nat, name]) => {
    if (q && !name.toLowerCase().includes(q) && !String(s).includes(q)) return false;
    if (filter === 'caught' && !caught.has(s)) return false;
    if (filter === 'missing' && caught.has(s)) return false;
    return true;
  });
  if (!visible.length) { grid.innerHTML = '<div class="empty">No Pokémon match.</div>'; return; }
  grid.innerHTML = '';
  for (const [s, nat, name] of visible) {
    const isCaught = caught.has(s);
    const card = document.createElement('div');
    card.className = `card ${isCaught ? 'caught' : 'not-caught'}`;
    card.dataset.id = s;
    card.innerHTML = `
      <span class="check">✓</span>
      <img src="${SPRITE(nat)}" alt="${name}" loading="lazy">
      <div class="card-num">#${String(s).padStart(3,'0')}</div>
      <div class="card-name">${name}</div>
    `;
    card.addEventListener('click', () => toggle(s));
    grid.appendChild(card);
  }
}

function toggle(id) {
  caught.has(id) ? caught.delete(id) : caught.add(id);
  save(); updateProgress();
  const card = document.querySelector(`.card[data-id="${id}"]`);
  if (!card) return;
  if (filter !== 'all') {
    card.remove();
    if (!document.querySelector('#grid .card')) document.getElementById('grid').innerHTML = '<div class="empty">No Pokémon match.</div>';
  } else {
    card.className = `card ${caught.has(id) ? 'caught' : 'not-caught'}`;
  }
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    filter = btn.dataset.filter;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  });
});

document.getElementById('search').addEventListener('input', e => { query = e.target.value; render(); });

updateProgress(); render();
</script>
</body>
</html>
