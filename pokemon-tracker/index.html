<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pok&#233;dex Tracker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f5f5f5; --surface: #fff; --border: #e0e0e0;
      --text: #1a1a1a; --muted: #888;
      --caught-bg: #e8f5e9; --caught-border: #4caf50; --caught-badge: #4caf50;
      --font: system-ui, -apple-system, sans-serif;
    }
    body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; }
    header {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 1rem 1.5rem; position: sticky; top: 0; z-index: 10;
      display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
    }
    .back { font-size: 0.8rem; color: var(--muted); text-decoration: none; white-space: nowrap; }
    .back:hover { color: var(--text); }
    .dex-tabs { display: flex; gap: 0.35rem; }
    .tab-btn {
      padding: 0.35rem 0.85rem; border: 1px solid var(--border); background: transparent;
      border-radius: 99px; font-size: 0.8rem; font-weight: 500; cursor: pointer; color: var(--text);
      transition: background 0.15s, border-color 0.15s; white-space: nowrap;
    }
    .tab-btn:hover { border-color: #bbb; }
    .tab-btn.active { background: var(--text); color: #fff; border-color: var(--text); }
    .progress-bar-wrap { flex: 1; min-width: 100px; max-width: 220px; display: flex; flex-direction: column; gap: 3px; }
    .progress-label { font-size: 0.75rem; color: var(--muted); }
    .progress-bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--caught-badge); border-radius: 3px; transition: width 0.3s ease; }
    .search-wrap { display: flex; align-items: center; }
    #search {
      padding: 0.3rem 0.75rem; border: 1px solid var(--border); border-radius: 99px;
      font-size: 0.8rem; outline: none; width: 130px; background: transparent;
    }
    #search:focus { border-color: #999; }
    .filters { display: flex; gap: 0.35rem; margin-left: auto; }
    .filter-btn {
      padding: 0.3rem 0.75rem; border: 1px solid var(--border); background: transparent;
      border-radius: 99px; font-size: 0.8rem; cursor: pointer; color: var(--text);
      transition: background 0.15s, border-color 0.15s;
    }
    .filter-btn.active { background: var(--text); color: #fff; border-color: var(--text); }
    main { padding: 1.25rem 1rem; max-width: 1200px; margin: 0 auto; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 0.5rem; }
    .card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
      display: flex; flex-direction: column; align-items: center;
      padding: 0.5rem 0.25rem 0.4rem; cursor: pointer; user-select: none;
      transition: border-color 0.15s, background 0.15s; position: relative;
    }
    .card:hover { border-color: #bbb; }
    .card.caught { background: var(--caught-bg); border-color: var(--caught-border); }
    .card.caught .check { opacity: 1; }
    .check { position: absolute; top: 4px; right: 5px; font-size: 0.65rem; color: var(--caught-badge); opacity: 0; }
    .card img { width: 56px; height: 56px; image-rendering: pixelated; }
    .card.not-caught img { filter: grayscale(1) opacity(0.35); }
    .card-num { font-size: 0.6rem; color: var(--muted); margin-top: 2px; }
    .card-name { font-size: 0.65rem; text-align: center; font-weight: 500; line-height: 1.2; margin-top: 1px; }
    .card.not-caught .card-name, .card.not-caught .card-num { color: var(--muted); }
    .empty { grid-column: 1 / -1; text-align: center; color: var(--muted); font-size: 0.9rem; padding: 3rem 0; }
  </style>
</head>
<body>
<header>

  </div>
  <div class="progress-bar-wrap">
    <div class="progress-label" id="progress-label">0 / 0</div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
  </div>
  <div class="search-wrap">
    <input id="search" type="search" placeholder="Search&#8230;" autocomplete="off">
  </div>
  <div class="filters">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="caught">Caught</button>
    <button class="filter-btn" data-filter="missing">Missing</button>
  </div>
</header>

const DEX_KEY = 'pokemon-active-dex';
let currentDex = localStorage.getItem(DEX_KEY) || 'lgp';
let filter = 'all', query = '';

for (const dex of Object.values(DEXES)) {
  dex.caught = new Set(JSON.parse(localStorage.getItem(dex.storageKey) || '[]'));
}

const SPRITE = key => `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${key}.png`;

function entryParts(entry, format) {
  if (format === 'bdsp') {
    const [s, n, name] = entry;
    return [s, name, n, s];
  }
  if (format === 'hza') {
    const [num, key, name, spriteId] = entry;
    return [key, name, spriteId || key, num];
  }
  const [key, name, displayNum, spriteId] = entry;
  return [key, name, spriteId || key, typeof key === 'number' ? key : (displayNum || 0)];
}

function updateProgress() {
  const dex = DEXES[currentDex];
  const total = dex.pokemon.length;
  const n = dex.caught.size;
  document.getElementById('progress-label').textContent = `${n} / ${total}`;
  document.getElementById('progress-fill').style.width = `${(n / total) * 100}%`;
}

function render() {
  const dex = DEXES[currentDex];
  const grid = document.getElementById('grid');
  const q = query.toLowerCase();
  const visible = dex.pokemon.filter(entry => {
    const [key, name] = entryParts(entry, dex.format);
    if (q && !name.toLowerCase().includes(q) && !String(key).includes(q)) return false;
    if (filter === 'caught' && !dex.caught.has(key)) return false;
    if (filter === 'missing' && dex.caught.has(key)) return false;
    return true;
  });
  if (!visible.length) { grid.innerHTML = '<div class="empty">No Pokémon match.</div>'; return; }
  grid.innerHTML = '';
  for (const entry of visible) {
    const [key, name, spriteKey, displayNum] = entryParts(entry, dex.format);
    const isCaught = dex.caught.has(key);
    const card = document.createElement('div');
    card.className = `card ${isCaught ? 'caught' : 'not-caught'}`;
    card.dataset.id = key;
    card.innerHTML = `
      <span class="check">✓</span>
      <img src="${SPRITE(spriteKey)}" alt="${name}" loading="lazy">
      <div class="card-num">#${String(displayNum).padStart(3,'0')}</div>
      <div class="card-name">${name}</div>
    `;
    card.addEventListener('click', () => toggle(key));
    grid.appendChild(card);
  }
}

function toggle(key) {
  const dex = DEXES[currentDex];
  dex.caught.has(key) ? dex.caught.delete(key) : dex.caught.add(key);
  localStorage.setItem(dex.storageKey, JSON.stringify([...dex.caught]));
  updateProgress();
  const card = document.querySelector(`.card[data-id="${key}"]`);
  if (!card) return;
  if (filter !== 'all') {
    card.remove();
    if (!document.querySelector('#grid .card')) {
      document.getElementById('grid').innerHTML = '<div class="empty">No Pokémon match.</div>';
    }
  } else {
    card.className = `card ${dex.caught.has(key) ? 'caught' : 'not-caught'}`;
  }
}

function switchDex(key) {
  currentDex = key;
  localStorage.setItem(DEX_KEY, key);
  filter = 'all';
  query = '';
  document.getElementById('search').value = '';
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.filter === 'all'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.dex === key));
  updateProgress();
  render();
}

document.querySelectorAll('.tab-btn').forEach(btn => btn.addEventListener('click', () => switchDex(btn.dataset.dex)));
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    filter = btn.dataset.filter;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  });
});
document.getElementById('search').addEventListener('input', e => { query = e.target.value; render(); });

switchDex(currentDex);
