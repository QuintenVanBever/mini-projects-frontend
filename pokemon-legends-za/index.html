<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumiose Dex — Legends Z-A</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f5f5;
      --surface: #fff;
      --border: #e0e0e0;
      --text: #1a1a1a;
      --muted: #888;
      --caught-bg: #e8f5e9;
      --caught-border: #4caf50;
      --caught-badge: #4caf50;
      --font: system-ui, -apple-system, sans-serif;
    }

    body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.5rem;
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 1.5rem;
      flex-wrap: wrap;
    }

    .back { font-size: 0.8rem; color: var(--muted); text-decoration: none; }
    .back:hover { color: var(--text); }

    header h1 { font-size: 1rem; font-weight: 600; white-space: nowrap; }

    .progress-bar-wrap {
      flex: 1; min-width: 120px; max-width: 260px;
      display: flex; flex-direction: column; gap: 3px;
    }
    .progress-label { font-size: 0.75rem; color: var(--muted); }
    .progress-bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--caught-badge); border-radius: 3px; transition: width 0.3s ease; }

    .filters { display: flex; gap: 0.4rem; margin-left: auto; }
    .filter-btn {
      padding: 0.3rem 0.75rem;
      border: 1px solid var(--border);
      background: transparent;
      border-radius: 99px;
      font-size: 0.8rem;
      cursor: pointer;
      color: var(--text);
      transition: background 0.15s, border-color 0.15s;
    }
    .filter-btn.active { background: var(--text); color: #fff; border-color: var(--text); }

    .search-wrap { display: flex; align-items: center; }
    #search {
      padding: 0.3rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 99px;
      font-size: 0.8rem;
      outline: none;
      width: 140px;
      background: transparent;
    }
    #search:focus { border-color: #999; }

    .warning-banner {
      background: #fff8e1;
      border-bottom: 1px solid #ffe082;
      padding: 0.6rem 1.5rem;
      font-size: 0.78rem;
      color: #5d4037;
    }

    main { padding: 1.25rem 1rem; max-width: 1200px; margin: 0 auto; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
      gap: 0.5rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0.5rem 0.25rem 0.4rem;
      cursor: pointer;
      user-select: none;
      transition: border-color 0.15s, background 0.15s;
      position: relative;
    }
    .card:hover { border-color: #bbb; }
    .card.caught { background: var(--caught-bg); border-color: var(--caught-border); }
    .card.caught .check { opacity: 1; }
    .check { position: absolute; top: 4px; right: 5px; font-size: 0.65rem; color: var(--caught-badge); opacity: 0; }
    .card img { width: 56px; height: 56px; image-rendering: pixelated; }
    .card.not-caught img { filter: grayscale(1) opacity(0.35); }
    .card-num { font-size: 0.6rem; color: var(--muted); margin-top: 2px; }
    .card-name { font-size: 0.65rem; text-align: center; font-weight: 500; line-height: 1.2; margin-top: 1px; }
    .card.not-caught .card-name, .card.not-caught .card-num { color: var(--muted); }
    .empty { grid-column: 1 / -1; text-align: center; color: var(--muted); font-size: 0.9rem; padding: 3rem 0; }
  </style>
</head>
<body>

<header>
  <a class="back" href="../">← Projects</a>
  <h1>Lumiose Dex — Legends Z-A</h1>
  <div class="progress-bar-wrap">
    <div class="progress-label" id="progress-label">0 / ?</div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
  </div>
  <div class="search-wrap">
    <input id="search" type="search" placeholder="Search…" autocomplete="off">
  </div>
  <div class="filters">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="caught">Caught</button>
    <button class="filter-btn" data-filter="missing">Missing</button>
  </div>
</header>

<div class="warning-banner">
  ⚠️ This list is incomplete — Legends Z-A released after my knowledge cutoff so I could only include confirmed Pokémon (~76 of 232). Share the full Lumiose Pokédex and I’ll update it.
</div>

<main>
  <div class="grid" id="grid"></div>
</main>

<script>
// National dex numbers — sorted by national dex #
// Confirmed: first partners (Chikorita/Tepig/Totodile lines), all Gen 6, known legendaries
const POKEMON = [
  [150,'Mewtwo'],
  [152,'Chikorita'],[153,'Bayleef'],[154,'Meganium'],
  [158,'Totodile'],[159,'Croconaw'],[160,'Feraligatr'],
  [498,'Tepig'],[499,'Pignite'],[500,'Emboar'],
  [650,'Chespin'],[651,'Quilladin'],[652,'Chesnaught'],
  [653,'Fennekin'],[654,'Braixen'],[655,'Delphox'],
  [656,'Froakie'],[657,'Frogadier'],[658,'Greninja'],
  [659,'Bunnelby'],[660,'Diggersby'],
  [661,'Fletchling'],[662,'Fletchinder'],[663,'Talonflame'],
  [664,'Scatterbug'],[665,'Spewpa'],[666,'Vivillon'],
  [667,'Litleo'],[668,'Pyroar'],
  [669,'Flabébé'],[670,'Floette'],[671,'Florges'],
  [672,'Skiddo'],[673,'Gogoat'],
  [674,'Pancham'],[675,'Pangoro'],
  [676,'Furfrou'],
  [677,'Espurr'],[678,'Meowstic'],
  [679,'Honedge'],[680,'Doublade'],[681,'Aegislash'],
  [682,'Spritzee'],[683,'Aromatisse'],
  [684,'Swirlix'],[685,'Slurpuff'],
  [686,'Inkay'],[687,'Malamar'],
  [688,'Binacle'],[689,'Barbaracle'],
  [690,'Skrelp'],[691,'Dragalge'],
  [692,'Clauncher'],[693,'Clawitzer'],
  [694,'Helioptile'],[695,'Heliolisk'],
  [696,'Tyrunt'],[697,'Tyrantrum'],
  [698,'Amaura'],[699,'Aurorus'],
  [700,'Sylveon'],
  [701,'Hawlucha'],
  [702,'Dedenne'],
  [703,'Carbink'],
  [704,'Goomy'],[705,'Sliggoo'],[706,'Goodra'],
  [707,'Klefki'],
  [708,'Phantump'],[709,'Trevenant'],
  [710,'Pumpkaboo'],[711,'Gourgeist'],
  [712,'Bergmite'],[713,'Avalugg'],
  [714,'Noibat'],[715,'Noivern'],
  [716,'Xerneas'],[717,'Yveltal'],[718,'Zygarde'],
  [719,'Diancie'],
];

const STORAGE_KEY = 'lza-lumiose-dex';
const SPRITE = id => `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${id}.png`;

let caught = new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'));
let filter = 'all';
let query = '';
const TOTAL = 232;

function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify([...caught])); }

function updateProgress() {
  const n = caught.size;
  document.getElementById('progress-label').textContent = `${n} / ${TOTAL}`;
  document.getElementById('progress-fill').style.width = `${(n / TOTAL) * 100}%`;
}

function render() {
  const grid = document.getElementById('grid');
  const q = query.toLowerCase();
  const visible = POKEMON.filter(([id, name]) => {
    if (q && !name.toLowerCase().includes(q) && !String(id).includes(q)) return false;
    if (filter === 'caught' && !caught.has(id)) return false;
    if (filter === 'missing' && caught.has(id)) return false;
    return true;
  });
  if (!visible.length) { grid.innerHTML = '<div class="empty">No Pokémon match.</div>'; return; }
  grid.innerHTML = '';
  for (const [id, name] of visible) {
    const isCaught = caught.has(id);
    const card = document.createElement('div');
    card.className = `card ${isCaught ? 'caught' : 'not-caught'}`;
    card.dataset.id = id;
    card.innerHTML = `
      <span class="check">✓</span>
      <img src="${SPRITE(id)}" alt="${name}" loading="lazy">
      <div class="card-num">#${String(id).padStart(3,'0')}</div>
      <div class="card-name">${name}</div>
    `;
    card.addEventListener('click', () => toggle(id));
    grid.appendChild(card);
  }
}

function toggle(id) {
  caught.has(id) ? caught.delete(id) : caught.add(id);
  save(); updateProgress();
  const card = document.querySelector(`.card[data-id="${id}"]`);
  if (!card) return;
  if (filter !== 'all') {
    card.remove();
    if (!document.querySelector('#grid .card')) document.getElementById('grid').innerHTML = '<div class="empty">No Pokémon match.</div>';
  } else {
    card.className = `card ${caught.has(id) ? 'caught' : 'not-caught'}`;
  }
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    filter = btn.dataset.filter;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  });
});

document.getElementById('search').addEventListener('input', e => { query = e.target.value; render(); });

updateProgress(); render();
</script>
</body>
</html>
